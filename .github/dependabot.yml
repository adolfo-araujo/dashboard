# Dependabot: avisa e abre pull requests quando sair atualização das bibliotecas.
# Correções de segurança chegam assim que publicadas; o resto, uma vez por semana.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    ignore:
      # Versões novas grandes (ex.: React 19, Tailwind 4) mudam o código; atualizar com calma, não por PR automático
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      api-pequenas:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    ignore:
      # Versões novas grandes (ex.: React 19, Tailwind 4) mudam o código; atualizar com calma, não por PR automático
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      web-pequenas:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    ignore:
      # Versões novas grandes (ex.: React 19, Tailwind 4) mudam o código; atualizar com calma, não por PR automático
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      site-pequenas:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
