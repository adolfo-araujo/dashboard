# TEMPORÁRIO: refaz o package-lock do app com as versões novas e se apaga em seguida.
name: Atualizar dependências (temporário)
on:
  push:
    branches: [seguranca]
    paths: ['.github/workflows/atualizar-dependencias-temp.yml']
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seguranca
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: App
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm audit --omit=dev || true
          npm ls zod react-router-dom axios follow-redirects @hookform/resolvers || true
          npm run build
      - name: Gravar
        run: |
          git config user.name "adolfo-araujo"
          git config user.email "ajoao6875@gmail.com"
          git rm -q .github/workflows/atualizar-dependencias-temp.yml
          git add web/package-lock.json web/package.json
          git commit -m "fix(deps): package-lock do app com as versões corrigidas

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01Dxd9d9Jfx9sXDnft2c6azC"
          git push
