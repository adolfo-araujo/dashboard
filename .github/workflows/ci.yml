name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API + banco (teste de ponta a ponta)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance-app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/finance-app
      JWT_ACCESS_TOKEN_SECRET: ci-access-secret
      JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret
      ADMIN_EMAILS: smoke-admin@test.dev
      # inicia o Sentry de verdade (endereço fictício) para pegar incompatibilidades
      SENTRY_DSN: https://public@o0.ingest.sentry.io/0
      PORT: 8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: node prisma/seed.js
      - name: Subir API e rodar teste de fumaça
        run: |
          node index.js &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && break; sleep 1; done
          npm run test:smoke
          node scripts/waitlist-test.js
      - name: Rotina de retenção (LGPD)
        run: node scripts/retention-test.js

  web:
    name: Build do dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  site:
    name: Build do site da empresa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  e2e:
    name: QA no navegador (computador e celular)
    # Playwright ainda não roda no Ubuntu 26.04
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance-app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/finance-app
      JWT_ACCESS_TOKEN_SECRET: ci-access-secret
      JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret
      PORT: 8080
      API_RATE_LIMIT: '100000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Subir a API
        working-directory: api
        run: |
          npm ci
          npx prisma migrate deploy
          node prisma/seed.js
          nohup node index.js > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && break; sleep 1; done
      # Build de produção servido com os mesmos cabeçalhos da Vercel (inclusive a CSP)
      - name: Subir o app (build de produção)
        working-directory: web
        run: |
          npm install
          npm run build
          nohup node ../e2e/servidor-producao.mjs dist vercel.json 5173 http://localhost:8080 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ >/dev/null && break; sleep 1; done
      - name: Subir o site da empresa (build de produção)
        working-directory: site
        run: |
          npm install
          npm run build
          nohup node ../e2e/servidor-producao.mjs dist vercel.json 5174 http://localhost:8080 > ../site.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5174/ >/dev/null && break; sleep 1; done
      - name: Rodar os testes no navegador
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: previas-do-site
          path: e2e/previas/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: relatorio-qa-navegador
          path: |
            e2e/playwright-report/
            e2e/test-results/
            api.log
            web.log

  carga:
    name: Teste de carga (100 pessoas, plano Starter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@v1
      # 100 pessoas usando ao mesmo tempo por 90 s, API com 0,5 CPU e 512 MB (Starter do Render)
      # e 120 ms até o banco (distância real Render ↔ Neon São Paulo, medida em 03/11/2026).
      # Reprova se 5% das respostas passarem de 1 s ou se mais de 1% der erro.
      - name: Rodar teste de carga
        env:
          USERS: '100'
          CPUS: '0.5'
          MEMORY: 512m
          DB_LATENCY_MS: '120'
          RAMP: 30s
          HOLD: 90s
          LABEL: Teste de carga desta mudança
        run: |
          ulimit -n 65535
          bash loadtest/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: teste-de-carga
          path: loadtest/resultado/

  dependencias:
    name: Dependências sem falhas de segurança críticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Reprova se alguma biblioteca usada em produção tiver falha CRÍTICA conhecida.
      # As de nível alto ou menor aparecem no relatório para corrigir com o Dependabot.
      - name: Auditoria
        run: |
          status=0
          for dir in api web site; do
            echo "::group::$dir"
            cd "$dir"
            [ -f package-lock.json ] || npm install --package-lock-only --no-audit --no-fund >/dev/null
            npm audit --omit=dev || true
            npm audit --omit=dev --audit-level=critical >/dev/null || { echo "::error::$dir tem falha crítica"; status=1; }
            summary=$(npm audit --omit=dev --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const v=JSON.parse(d).metadata.vulnerabilities;console.log(\`críticas \${v.critical}, altas \${v.high}, moderadas \${v.moderate}, baixas \${v.low}\`)})")
            echo "| $dir | $summary |" >> ../audit.md
            cd ..
            echo "::endgroup::"
          done
          { echo "### Falhas conhecidas nas bibliotecas de produção"; echo; echo "| Parte | Resultado |"; echo "| --- | --- |"; cat audit.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  segredos:
    name: Nenhuma senha ou chave no código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # todo o histórico: um segredo apagado depois continua no histórico
      # gitleaks procura senhas, chaves de API, tokens e strings de conexão em todos os commits
      - name: Varredura com gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner --exit-code 1
