name: Diagnóstico temporário (termos)
on:
  push:
    branches: [diag-termos]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Rotas novas na API de produção
        run: |
          API=https://api.valtrea.com.br/api
          for i in 1 2 3; do curl -s -o /dev/null -m 60 "$API/health" && break; done
          echo "health: $(curl -s -m 30 $API/health)"
          echo "POST /users/me/terms sem token: $(curl -s -m 30 -X POST -H 'Content-Type: application/json' -d '{"version":"2026-11-04"}' -w ' [%{http_code}]' $API/users/me/terms)"
          echo "GET /users/me/export sem token: $(curl -s -m 30 -w ' [%{http_code}]' $API/users/me/export)"
          echo "GET /users/me sem token: $(curl -s -m 30 -w ' [%{http_code}]' $API/users/me)"
          echo "OPTIONS /users/me/terms (preflight):"
          curl -s -m 30 -i -X OPTIONS -H 'Origin: https://finance.valtrea.com.br' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type' $API/users/me/terms | head -20
          echo "POST com token inválido: $(curl -s -m 30 -X POST -H 'Authorization: Bearer x.y.z' -H 'Content-Type: application/json' -d '{"version":"2026-11-04"}' -w ' [%{http_code}]' $API/users/me/terms)"
          echo "POST /users/me/terms com barra no fim: $(curl -s -m 30 -X POST -w ' [%{http_code}]' $API/users/me/terms/)"
