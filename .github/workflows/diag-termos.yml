name: Diagnóstico temporário (segurança em produção)
on:
  push:
    branches: [diag-termos]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Sondagem
        run: |
          for host in finance.valtrea.com.br www.valtrea.com.br valtrea.com.br api.valtrea.com.br; do
            echo "HTTP→HTTPS $host: $(curl -s -m 30 -o /dev/null -w '%{http_code} -> %{redirect_url}' http://$host/)"
          done
          for url in https://finance.valtrea.com.br/ https://www.valtrea.com.br/ https://api.valtrea.com.br/api/health; do
            echo "== cabeçalhos $url"
            curl -s -m 30 -D - -o /dev/null $url | grep -iE "^(strict-transport|content-security|x-frame|x-content-type|referrer-policy|permissions-policy|x-powered-by|server):" | cut -c1-160
          done
          curl -s -m 30 https://finance.valtrea.com.br/ -o index.html
          for js in $(grep -oE '/assets/[^"]+\.js' index.html | sort -u); do
            echo "source map de $js: $(curl -s -m 30 -o /dev/null -w '%{http_code} %{content_type}' https://finance.valtrea.com.br$js.map)"
            curl -s -m 30 https://finance.valtrea.com.br$js -o bundle.js
            echo "  sourceMappingURL no bundle: $(grep -c 'sourceMappingURL' bundle.js)"
            echo "  possíveis segredos no bundle: $(grep -oE 'postgres(ql)?://|re_[A-Za-z0-9]{20,}|sk_(live|test)_|JWT_(ACCESS|REFRESH)|DATABASE_URL|BACKUP_PASSPHRASE|RESEND_API_KEY' bundle.js | sort | uniq -c | tr '\n' ' ')"
          done
          echo "== erro 500/404 da API não revela detalhes"
          echo "rota inexistente: $(curl -s -m 30 -w ' [%{http_code}]' https://api.valtrea.com.br/api/nao-existe)"
          echo "JSON quebrado: $(curl -s -m 30 -X POST -H 'Content-Type: application/json' -d '{quebrado' -w ' [%{http_code}]' https://api.valtrea.com.br/api/users/login)"
          echo "id inválido: $(curl -s -m 30 -H 'Authorization: Bearer abc' -w ' [%{http_code}]' https://api.valtrea.com.br/api/transactions/me)"
          echo "arquivos sensíveis no app: .env=$(curl -s -m 30 -o /dev/null -w '%{http_code}' https://finance.valtrea.com.br/.env) .git/config=$(curl -s -m 30 -o /dev/null -w '%{http_code}' https://finance.valtrea.com.br/.git/config)"
          echo "  conteúdo de /.env começa com: $(curl -s -m 30 https://finance.valtrea.com.br/.env | head -c 40)"
          echo "CORS de origem estranha: $(curl -s -m 30 -D - -o /dev/null -H 'Origin: https://site-malicioso.com' https://api.valtrea.com.br/api/health | grep -i 'access-control-allow-origin' || echo 'sem allow-origin (bloqueado)')"
