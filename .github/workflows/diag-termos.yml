name: Diagnóstico temporário (versão em produção)
on:
  push:
    branches: [diag-termos]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Versão da API em produção
        run: |
          API=https://api.valtrea.com.br/api
          for i in 1 2 3; do curl -s -o /dev/null -m 60 "$API/health" && break; done
          # campo invisível preenchido: a versão nova recusa sem criar nada
          echo "cadastro de robô: $(curl -s -m 30 -X POST -H 'Content-Type: application/json' -d '{"first_name":"Robo","last_name":"Teste","email":"robo-sonda@test.dev","password":"senha12345","website":"http://spam.example"}' -w ' [%{http_code}]' $API/users)"
          for url in https://finance.valtrea.com.br/ https://www.valtrea.com.br/ https://api.valtrea.com.br/api/health; do
            echo "== cabeçalhos $url"
            curl -s -m 30 -D - -o /dev/null $url | grep -iE "^(strict-transport-security|content-security-policy|x-frame-options|x-content-type-options):" | cut -c1-120
          done
